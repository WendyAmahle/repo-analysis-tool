<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Analysis Tool</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f6f7fb; color: #202124; }
    header { background: #1f2937; color: white; padding: 1rem 2rem; }
    main { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }
    .card { background: white; border: 1px solid #d9dee8; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; padding: .55rem; border: 1px solid #b9c0cc; border-radius: 6px; font: inherit; }
    button { background: #2563eb; color: white; border-color: #2563eb; cursor: pointer; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: .55rem; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; }
    .metric { font-size: 1.4rem; font-weight: 800; }
    .muted { color: #6b7280; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; padding: .75rem; border-radius: 8px; }
    .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; padding: .75rem; border-radius: 8px; }
    a { color: #1d4ed8; text-decoration: none; }
    code { background: #eef2ff; padding: .1rem .25rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Repo Analysis Tool</h1>
    <div class="muted">Basic git metrics dashboard for cloned repositories</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
